service: kotoba
image: ryosaeba35/kotoba-cipher-api

servers:
  web:
    - 84.235.238.72

ssh:
  user: ubuntu

proxy:
  ssl: true
  app_port: 3000
  host: kotoba.galernestudio.com
  healthcheck:
    path: /up

registry:
  server: ghcr.io
  username: ryosaeba35
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - CRON_SECRET
    - FIREBASE_SERVICE_ACCOUNT
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "true"
    RAILS_SERVE_STATIC_FILES: "true"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

builder:
  arch: arm64
  remote: ssh://ubuntu@84.235.238.72

accessories:
  db:
    image: postgres:18
    host: 84.235.238.72
    env:
      clear:
        POSTGRES_USER: kotoba
        POSTGRES_DB: kotoba_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql   # Postgres 18 data path, survives redeploys
    options:
      memory: 256m
